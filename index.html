  <!-- LDF AI ASSISTANTS: paste before </body> -->
<section id="ldf-ai" class="ldf-ai">
  <h2>LDF AI Assistants</h2>
  <p>Ask about learning, personal development, or the LDF HOPE project.</p>

  <label for="ldf-agent">Choose your assistant</label>
  <select id="ldf-agent">
    <option value="learning">LDF Learning Assistant</option>
    <option value="hope">LDF HOPE Assistant</option>
  </select>

  <div id="ldf-chat" class="ldf-chat" aria-live="polite">
    <p class="ldf-message ldf-bot">
      Welcome to LDF. Choose an assistant and ask your question.
    </p>
  </div>

  <form id="ldf-form">
    <label for="ldf-question">Your question</label>
    <textarea id="ldf-question" maxlength="4000"
      rows="3" placeholder="Type your question..." required></textarea>
    <button id="ldf-send" type="submit">Ask LDF AI</button>
    <p id="ldf-status" role="status"></p>
  </form>
</section>

<style>
.ldf-ai {
  max-width: 760px;
  margin: 32px auto;
  padding: 24px;
  border: 1px solid #dbe5f5;
  border-radius: 18px;
  background: #fff;
  color: #152544;
  font-family: Arial, sans-serif;
  box-shadow: 0 8px 30px rgba(0, 43, 127, .08);
}
.ldf-ai h2 { color: #002b7f; margin-top: 0; }
.ldf-ai label { display: block; margin: 14px 0 7px; font-weight: 600; }
.ldf-ai select, .ldf-ai textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  border: 1px solid #c8d4e8;
  border-radius: 9px;
  background: #fff;
  color: #152544;
  font: inherit;
}
.ldf-chat {
  min-height: 110px;
  max-height: 360px;
  overflow-y: auto;
  margin-top: 18px;
  padding: 12px;
  background: #f5f8fe;
  border-radius: 12px;
}
.ldf-message {
  padding: 12px;
  border-radius: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.55;
}
.ldf-bot { background: #e5edff; }
.ldf-user { background: #e5f6eb; }
#ldf-send {
  margin-top: 12px;
  padding: 12px 20px;
  border: 0;
  border-radius: 9px;
  background: #0046ad;
  color: white;
  font-weight: 700;
  cursor: pointer;
}
#ldf-send:disabled { opacity: .6; cursor: wait; }
#ldf-status { font-size: .9rem; color: #4b5e7a; }
</style>

<script>
(() => {
  const endpoint =
    "https://ldf-ai-gateway.lifedevelopmentfoundation-docs.workers.dev/";

  const form = document.getElementById("ldf-form");
  const agentSelect = document.getElementById("ldf-agent");
  const question = document.getElementById("ldf-question");
  const chat = document.getElementById("ldf-chat");
  const send = document.getElementById("ldf-send");
  const status = document.getElementById("ldf-status");

  function addMessage(text, type) {
    const p = document.createElement("p");
    p.className = "ldf-message " + type;
    p.textContent = text;
    chat.appendChild(p);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = question.value.trim();
    if (!message || send.disabled) return;

    const agent = agentSelect.value;
    addMessage(message, "ldf-user");
    question.value = "";
    send.disabled = true;
    status.textContent = "LDF AI is thinking...";

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent, message })
      });

      const data = await response.json();

      if (!response.ok || !data.success || !data.answer) {
        throw new Error(data.error || "The AI request failed.");
      }

      addMessage(data.answer, "ldf-bot");
      status.textContent = "Response received.";
    } catch (error) {
      addMessage(
        "Sorry, the assistant is temporarily unavailable. Please try again later.",
        "ldf-bot"
      );
      status.textContent = "Connection failed. Please try again.";
      console.error("LDF AI request failed:", error);
    } finally {
      send.disabled = false;
      question.focus();
    }
  });
})();
</script>
